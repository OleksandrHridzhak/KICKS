info:
  name: Update product
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{url}}/products"
  body:
    type: json
    data: "{\r

      \  \"name\": \"Nike Air Max 270\",\r

      \  \"description\": \"Кросівки Nike Air Max 270 для повсякденного використання. Легкі та зручні.\",\r

      \  \"price\": 149.99,\r

      \  \"category\": \"shoes\",\r

      \  \"brand\": \"Nike\"\r

      }"
  auth: inherit

runtime:
  variables:
    - name: url
      value: http://localhost:3337/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
