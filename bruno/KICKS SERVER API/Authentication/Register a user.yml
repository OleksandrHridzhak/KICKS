info:
  name: Register a user
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "",
        "password": "",
        "gender": "MALE",
        "firstName": "",
        "lastName": "",
        "rememberMe": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: User registered successfully
    request:
      url: "{{baseUrl}}/api/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "gender": "MALE",
            "firstName": "",
            "lastName": "",
            "rememberMe": false
          }
    response:
      status: 201
      statusText: Created
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid registration data
    request:
      url: "{{baseUrl}}/api/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "gender": "MALE",
            "firstName": "",
            "lastName": "",
            "rememberMe": false
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 409 Response
    description: User already exists
    request:
      url: "{{baseUrl}}/api/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "gender": "MALE",
            "firstName": "",
            "lastName": "",
            "rememberMe": false
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/auth/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": "",
            "gender": "MALE",
            "firstName": "",
            "lastName": "",
            "rememberMe": false
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": ""
          }

docs: Creates a new user account and sets authentication cookies.
