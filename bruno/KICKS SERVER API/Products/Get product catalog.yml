info:
  name: Get product catalog
  type: http
  seq: 1
  tags:
    - Products

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "4"
      type: query
    - name: size
      value: 40,41
      type: query
    - name: color
      value: black,white
      type: query
    - name: categoryIds
      value: running,basketball
      type: query
    - name: priceMin
      value: "50"
      type: query
    - name: priceMax
      value: "250"
      type: query
    - name: targetGender
      value: MEN
      type: query
      disabled: true
    - name: targetGender
      value: WOMEN
      type: query
      disabled: true
    - name: targetGender
      value: UNISEX
      type: query
      disabled: true
    - name: sortBy
      value: price_asc
      type: query
      disabled: true
    - name: sortBy
      value: price_desc
      type: query
      disabled: true
    - name: sortBy
      value: newest
      type: query
      disabled: true
    - name: sortBy
      value: oldest
      type: query
      disabled: true
    - name: sortBy
      value: tranding
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

